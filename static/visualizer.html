<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSSC PhotoBooth 3.0 · Audio Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --g: #00e676;
            --g2: #00c853;
            --g3: #69f0ae;
            --gdim: rgba(0,230,118,0.14);
            --gglow: rgba(0,230,118,0.35);
            --t1: #ffffff;
            --t2: #a0a0a0;
            --t3: #555555;
            --b1: rgba(255,255,255,0.08);
            --b2: rgba(255,255,255,0.16);
            --bg1: rgba(0,230,118,0.22);
            --r-pill: 999px;
            --r-xl: 18px;
            --r-lg: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --ease: cubic-bezier(0.22,1,0.36,1);
            --spring: cubic-bezier(0.34,1.56,0.64,1);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            width: 100vw; height: 100vh;
            overflow: hidden; font-family: var(--font);
            color: var(--t1); user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        #bgCanvas  { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
        #vizCanvas { position:fixed; inset:0; width:100%; height:100%; z-index:1; }

        /* ── AMBIENT ORBS FX ── */
        .bg-orb {
            position: fixed; border-radius: 50%; filter: blur(100px);
            pointer-events: none; z-index: 0;
            animation: orbDrift 14s ease-in-out infinite alternate;
        }
        .orb-1 { width:700px; height:500px; background:rgba(0,200,83,0.12); top:-100px; left:-100px; }
        .orb-2 { width:500px; height:400px; background:rgba(0,230,118,0.08); top:30%; right:-80px; animation-delay:-5s; }
        .orb-3 { width:450px; height:380px; background:rgba(105,240,174,0.06); bottom:-80px; left:35%; animation-delay:-9s; }
        @keyframes orbDrift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(35px,22px) scale(1.05); }
        }

        /* ── TOP BAR ── */
        .top-bar {
            position: fixed; top:0; left:0; right:0; z-index:10;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 28px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            pointer-events: auto;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img {
            width: 36px; height: 36px; object-fit: contain;
            filter: drop-shadow(0 0 10px var(--gglow));
            animation: logoGlow 3.5s ease-in-out infinite alternate;
        }
        @keyframes logoGlow {
            from { filter: drop-shadow(0 0 6px rgba(0,230,118,0.35)); }
            to   { filter: drop-shadow(0 0 18px rgba(0,230,118,0.75)); }
        }
        .brand-text { display: flex; flex-direction: column; }
        .brand-title { font-size: 0.9rem; font-weight: 800; color: var(--t1); letter-spacing: -0.2px; }
        .brand-sub { font-size: 0.66rem; color: var(--t3); font-weight: 500; }

        .src-badge {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.6px;
            padding: 4px 14px; border-radius: var(--r-pill);
            background: var(--gdim); border: 1px solid var(--bg1); color: var(--g);
            display: flex; align-items: center; gap: 7px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        }
        .src-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--g);
            box-shadow: 0 0 8px var(--g); animation: dotPulse 1.6s ease infinite;
        }
        @keyframes dotPulse {
            0% { transform:scale(0.9); box-shadow:0 0 0 0 var(--gglow); }
            70% { transform:scale(1); box-shadow:0 0 0 6px transparent; }
            100% { transform:scale(0.9); }
        }

        /* ── INTERACTIVE TAP BANNER ── */
        #audioEnableBanner {
            position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
            background: rgba(0,230,118,0.15); border: 1px solid var(--bg1);
            color: var(--t1); padding: 8px 20px; border-radius: var(--r-pill);
            font-size: 0.78rem; font-weight: 600; z-index: 30;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 20px var(--gdim);
            cursor: pointer; transition: all 0.25s var(--ease);
            display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(16px);
        }
        #audioEnableBanner:hover { background: rgba(0,230,118,0.25); transform: translateX(-50%) scale(1.02); }
        #audioEnableBanner.hidden { display: none !important; }

        /* ── STATUS TOAST ── */
        #statusToast {
            position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
            background: rgba(15,15,15,0.85); border: 1px solid var(--b1);
            padding: 7px 18px; border-radius: var(--r-pill); font-size: 0.76rem;
            color: var(--t2); z-index: 20; opacity: 0;
            transition: opacity 0.4s var(--ease); pointer-events: none;
            backdrop-filter: blur(16px);
        }

        /* ── TRACK INFO OVERLAY ── */
        .track-info {
            position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%);
            text-align: center; z-index: 10; pointer-events: none; min-width: 320px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .track-title {
            font-size: 1.35rem; font-weight: 800; letter-spacing: -0.4px;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 650px;
        }
        .track-sub {
            font-size: 0.68rem; color: var(--g); font-weight: 700;
            letter-spacing: 1.8px; text-transform: uppercase;
            background: var(--gdim); padding: 2px 12px; border-radius: var(--r-pill);
            border: 1px solid var(--bg1);
        }

        /* ── BOTTOM BAR CONTROLS ── */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            padding: 16px 24px; gap: 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--b1);
            color: var(--t2); border-radius: var(--r-pill);
            padding: 7px 18px; font-size: 0.78rem; font-family: var(--font);
            font-weight: 600; cursor: pointer; transition: all 0.2s var(--ease);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.12); color: var(--t1); transform: translateY(-2px); }
        .ctrl-btn:active { transform: scale(0.96); }
        .ctrl-btn.active {
            background: var(--gdim); border-color: var(--bg1);
            color: var(--g); font-weight: 700;
            box-shadow: 0 2px 14px var(--gglow);
        }
    </style>
</head>
<body>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<canvas id="bgCanvas"></canvas>
<canvas id="vizCanvas"></canvas>

<div class="top-bar">
    <div class="brand">
        <img src="/static/img/pssc_logo.png" alt="PSSC">
        <div class="brand-text">
            <span class="brand-title">PSSC PhotoBooth 3.0</span>
            <span class="brand-sub">Audio Visualizer &bull; Avee Engine</span>
        </div>
    </div>
    <div class="src-badge"><span class="src-dot"></span><span id="srcLabel">LIVE SPECTRUM</span></div>
</div>

<div id="audioEnableBanner">⚡ Tap anywhere to activate live audio spectrum sync</div>
<div id="statusToast">🎵 Visualizer Ready</div>

<div class="track-info">
    <div class="track-title" id="trackTitle">PSSC PhotoBooth Music</div>
    <div class="track-sub">LIVE AUDIO SPECTRUM &bull; AVEE PARALLAX</div>
</div>

<div class="bottom-bar">
    <button class="ctrl-btn" id="btnCircle" onclick="setMode('circle')">🔵 Circle</button>
    <button class="ctrl-btn" id="btnBars"   onclick="setMode('bars')">📊 Bars</button>
    <button class="ctrl-btn" id="btnWave"   onclick="setMode('wave')">〰️ Wave</button>
    <button class="ctrl-btn active" id="btnAll" onclick="setMode('all')">✨ All</button>
    <button class="ctrl-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>

<script>
// ─── CANVAS SETUP ──────────────────────────────────────────────────────────
const bgC = document.getElementById('bgCanvas');
const vzC = document.getElementById('vizCanvas');
const bg  = bgC.getContext('2d');
const vz  = vzC.getContext('2d');
let W, H, cx, cy;

function resize() {
    W = bgC.width = vzC.width = window.innerWidth;
    H = bgC.height = vzC.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ─── AUDIO ENGINE & SPECTRUM STATE ───────────────────────────────────────
let audioCtx = null;
let analyser = null;
let gainNode = null;
let sourceNode = null;
let audioEl = null;

const bufLen = 512;
const freqData = new Uint8Array(bufLen);
const timeData = new Uint8Array(bufLen);

let currentFilename = null;
let vizMode = 'all';
let synthPhase = 0;
let isAudioActive = false;

// ─── CONNECT TO PARENT WINDOW AUDIO ANALYSER IF OPENED VIA POPUP ────────
function tryConnectParentWindow() {
    try {
        if (window.opener && window.opener.__PSSC_MUSIC_VISUALIZER__) {
            const graph = window.opener.__PSSC_MUSIC_VISUALIZER__.activate('visualizer_window');
            if (graph && graph.analyser) {
                analyser = graph.analyser;
                isAudioActive = true;
                hideBanner();
                toast("🟢 Connected directly to main window audio player!");
                return true;
            }
        }
    } catch(e) {}
    return false;
}

function hideBanner() {
    const banner = document.getElementById('audioEnableBanner');
    if (banner) banner.classList.add('hidden');
}

function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
}

function toast(msg) {
    const el = document.getElementById('statusToast');
    if (!el) return;
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.style.opacity = '0', 3500);
}

// ─── LOAD AND PLAY TRACK WITH AUDIO ANALYSER ─────────────────────────────
async function loadTrack(filename, title, source) {
    if (filename === currentFilename && audioEl) return;
    currentFilename = filename;

    document.getElementById('trackTitle').textContent = title || 'PSSC Background Music';
    document.getElementById('srcLabel').textContent =
        source === 'youtube' ? 'YOUTUBE' : source === 'custom' ? 'LOCAL MP3' : 'SPOTIFY';

    if (tryConnectParentWindow()) return;

    const ctx = getCtx();

    // Tear down previous track nodes
    if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} sourceNode = null; }
    if (audioEl)    { audioEl.pause(); audioEl.src = ''; }

    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.78;

    gainNode = ctx.createGain();
    gainNode.gain.value = 0.001; // Tiny gain connected to destination keeps audio pipeline active!

    audioEl = new Audio();
    audioEl.crossOrigin = 'anonymous';
    audioEl.src = `/audio/${filename}?viz=${Date.now()}`;
    audioEl.loop = true;

    try {
        sourceNode = ctx.createMediaElementSource(audioEl);
        sourceNode.connect(analyser);
        analyser.connect(gainNode);
        gainNode.connect(ctx.destination);
    } catch(e) {}

    try {
        await ctx.resume();
        await audioEl.play();
        isAudioActive = true;
        hideBanner();
        toast('▶️ Visualizer synced: ' + (title || filename));
    } catch(e) {
        toast('⚡ Tap anywhere to activate live audio');
    }
}

// ─── USER INTERACTION AUTOPLAY RESUME ─────────────────────────────────────
async function enableAudioUserGesture() {
    hideBanner();
    if (tryConnectParentWindow()) return;

    const ctx = getCtx();
    await ctx.resume().catch(()=>{});
    if (audioEl && audioEl.paused) {
        audioEl.play().then(() => {
            isAudioActive = true;
            toast("🟢 Audio spectrum active");
        }).catch(()=>{});
    }
}

document.addEventListener('click', enableAudioUserGesture);
document.addEventListener('keydown', enableAudioUserGesture);

// ─── FETCH ACTIVE MUSIC TRACK ──────────────────────────────────────────────
async function fetchActiveTrack() {
    if (tryConnectParentWindow()) return;
    try {
        const res  = await fetch('/api/music/library');
        const data = await res.json();
        if (data.success && data.tracks) {
            const active = data.tracks.find(t => t.is_active);
            if (active && active.filename) {
                await loadTrack(active.filename, active.title, active.source);
                return;
            }
        }
    } catch(e) {}
}

fetchActiveTrack();
setInterval(fetchActiveTrack, 4000);

// BroadcastChannel listener from main app
if (typeof BroadcastChannel !== 'undefined') {
    const bc = new BroadcastChannel('pssc_music_visualizer');
    bc.addEventListener('message', e => {
        if (e.data && e.data.title) {
            document.getElementById('trackTitle').textContent = e.data.title;
        }
    });
}

// ─── SYNTHETIC SPECTRUM GENERATOR (FALLBACK SO IT NEVER FLATLINES) ────────
function generateSynthSpectrum() {
    synthPhase += 0.05;
    let sumEnergy = 0;

    for (let i = 0; i < bufLen; i++) {
        // Generate realistic multi-band audio spectrum curve (bass > mids > highs)
        const normalizedIndex = i / bufLen;
        const bassFactor = Math.exp(-normalizedIndex * 5.0);
        const midFactor = Math.sin(normalizedIndex * Math.PI * 3.0) * 0.4;
        
        const rhythmPulse = Math.pow(Math.sin(synthPhase * 2.2), 4.0) * 160.0;
        const subBassPulse = Math.sin(synthPhase * 1.1 + i * 0.08) * 45.0;
        const noise = Math.random() * 25.0;

        let val = (bassFactor * (120.0 + rhythmPulse) + subBassPulse + midFactor * 60.0 + noise);
        val = Math.min(255, Math.max(10, val));
        freqData[i] = val;
        sumEnergy += val;

        // Waveform time domain simulation
        timeData[i] = 128 + Math.sin(synthPhase * 3.0 + i * 0.12) * (val * 0.35);
    }

    return sumEnergy / (bufLen * 255);
}

// ─── PARTICLES ─────────────────────────────────────────────────────────────
class Particle {
    constructor() { this.reset(); }
    reset() {
        const a = Math.random() * Math.PI * 2;
        const r = 90 + Math.random() * Math.min(W||800, H||600) * 0.32;
        this.x    = cx + Math.cos(a) * r;
        this.y    = cy + Math.sin(a) * r;
        this.vx   = (Math.random() - 0.5) * 0.6;
        this.vy   = (Math.random() - 0.5) * 0.6;
        this.life = 0.5 + Math.random() * 0.5;
        this.dec  = 0.003 + Math.random() * 0.006;
        this.size = 1.2 + Math.random() * 2.6;
    }
    update(e) {
        this.x += this.vx * (1 + e * 4);
        this.y += this.vy * (1 + e * 4);
        this.life -= this.dec;
        if (this.life <= 0) this.reset();
    }
    draw() {
        vz.save();
        vz.globalAlpha = this.life * 0.85;
        vz.fillStyle   = '#00e676';
        vz.shadowBlur  = 8;
        vz.shadowColor = '#00e676';
        vz.beginPath(); vz.arc(this.x, this.y, this.size, 0, Math.PI * 2); vz.fill();
        vz.restore();
    }
}
const particles = Array.from({length:160}, () => new Particle());

// ─── SPECTRUM ANALYSIS HELPERS ──────────────────────────────────────────────
function getEnergy() {
    let s = 0; for (let i = 0; i < bufLen; i++) s += freqData[i];
    return s / (bufLen * 255);
}
function getBass() {
    let s = 0; const n = 16;
    for (let i = 0; i < n; i++) s += freqData[i];
    return s / (n * 255);
}

// ─── BACKGROUND FX ─────────────────────────────────────────────────────────
function drawBg(energy, bass) {
    bg.fillStyle = `rgba(0,0,0,${0.14 + (1 - energy) * 0.06})`;
    bg.fillRect(0, 0, W, H);

    const g = bg.createRadialGradient(cx, cy, 0, cx, cy, W * 0.4 + bass * 120);
    g.addColorStop(0, `rgba(0,230,118,${0.06 + bass * 0.12})`);
    g.addColorStop(1, 'transparent');
    bg.fillStyle = g;
    bg.fillRect(0, 0, W, H);
}

// ─── RENDERERS (GREEN x BLACK x WHITE THEME) ───────────────────────────────

function drawCircle(energy, bass) {
    const BARS = 120, step = Math.floor(bufLen / BARS);
    const radius = Math.min(W, H) * (0.22 + bass * 0.07);
    const maxH = Math.min(W, H) * 0.22;
    
    vz.save();
    for (let i = 0; i < BARS; i++) {
        const val = freqData[i * step] / 255;
        const barH = val * maxH;
        const angle = (i / BARS) * Math.PI * 2 - Math.PI / 2;
        const x1 = cx + Math.cos(angle) * radius;
        const y1 = cy + Math.sin(angle) * radius;
        const x2 = cx + Math.cos(angle) * (radius + barH);
        const y2 = cy + Math.sin(angle) * (radius + barH);

        vz.strokeStyle = `rgba(0,230,118,${0.40 + val * 0.60})`;
        vz.lineWidth = 2.8;
        vz.shadowBlur = 10 + val * 16;
        vz.shadowColor = '#00e676';
        vz.beginPath(); vz.moveTo(x1, y1); vz.lineTo(x2, y2); vz.stroke();
    }
    vz.restore();

    // Center pulsing green aura
    const pr = Math.min(W, H) * (0.15 + bass * 0.08);
    const pg = vz.createRadialGradient(cx, cy, 0, cx, cy, pr);
    pg.addColorStop(0, `rgba(0,230,118,${0.18 + bass * 0.35})`);
    pg.addColorStop(1, 'transparent');
    vz.save(); vz.fillStyle = pg; vz.beginPath(); vz.arc(cx, cy, pr, 0, Math.PI * 2); vz.fill(); vz.restore();
}

function drawBars() {
    const BARS = 64, step = Math.floor(bufLen / BARS);
    const maxH = H * 0.42;
    const barW = (W * 0.88) / BARS;
    const startX = W * 0.06;
    const baseY = H * 0.72;

    vz.save();
    for (let i = 0; i < BARS; i++) {
        const val = freqData[i * step] / 255;
        const barH = Math.max(4, val * maxH);
        const x = startX + i * barW;

        // Gradient Green -> Mint
        const g = vz.createLinearGradient(x, baseY, x, baseY - barH);
        g.addColorStop(0, 'rgba(0, 200, 83, 0.85)');
        g.addColorStop(1, 'rgba(105, 240, 174, 1.0)');

        vz.fillStyle = g;
        vz.shadowBlur = 10 + val * 16;
        vz.shadowColor = 'rgba(0,230,118,0.6)';
        
        // Rounded bar caps
        if (vz.roundRect) {
            vz.beginPath();
            vz.roundRect(x + 1, baseY - barH, barW - 3, barH, [4, 4, 0, 0]);
            vz.fill();
        } else {
            vz.fillRect(x + 1, baseY - barH, barW - 3, barH);
        }

        // Reflection
        const rg = vz.createLinearGradient(x, baseY, x, baseY + barH * 0.3);
        rg.addColorStop(0, 'rgba(0,230,118,0.18)');
        rg.addColorStop(1, 'transparent');
        vz.fillStyle = rg; vz.shadowBlur = 0;
        vz.fillRect(x + 1, baseY, barW - 3, barH * 0.3);

        // Peak top line
        if (barH > 6) {
            vz.fillStyle = '#ffffff';
            vz.shadowBlur = 10;
            vz.shadowColor = '#ffffff';
            vz.fillRect(x + 1, baseY - barH - 3, barW - 3, 2);
        }
    }
    vz.restore();
}

function drawWave() {
    const sliceW = W / bufLen;
    const grad = vz.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, '#00c853');
    grad.addColorStop(0.5, '#00e676');
    grad.addColorStop(1, '#69f0ae');

    vz.save();
    vz.strokeStyle = grad;
    vz.lineWidth = 3.2;
    vz.shadowBlur = 16;
    vz.shadowColor = 'rgba(0,230,118,0.8)';
    vz.beginPath();
    let x = 0;
    for (let i = 0; i < bufLen; i++) {
        const y = cy + (timeData[i] / 128.0 - 1) * (H * 0.32);
        i === 0 ? vz.moveTo(x, y) : vz.lineTo(x, y);
        x += sliceW;
    }
    vz.stroke();

    // Glowing echo line
    vz.globalAlpha = 0.25;
    vz.lineWidth = 1.8;
    vz.shadowBlur = 6;
    x = 0;
    vz.beginPath();
    for (let i = 0; i < bufLen; i++) {
        const y = cy + (timeData[i] / 128.0 - 1) * (H * 0.32) + 8;
        i === 0 ? vz.moveTo(x, y) : vz.lineTo(x, y);
        x += sliceW;
    }
    vz.stroke();
    vz.restore();
}

// ─── MAIN ANIMATION LOOP ───────────────────────────────────────────────────
function mainLoop() {
    requestAnimationFrame(mainLoop);

    let hasRealData = false;
    if (analyser) {
        analyser.getByteFrequencyData(freqData);
        analyser.getByteTimeDomainData(timeData);
        for (let i = 0; i < 20; i++) {
            if (freqData[i] > 5) { hasRealData = true; break; }
        }
    }

    // If analyser has no live audio or is quiet, feed synthetic energetic spectrum so it NEVER flatlines!
    if (!hasRealData) {
        generateSynthSpectrum();
    }

    const energy = getEnergy();
    const bass = getBass();

    drawBg(energy, bass);
    vz.clearRect(0, 0, W, H);

    if (vizMode === 'circle' || vizMode === 'all') drawCircle(energy, bass);
    if (vizMode === 'bars'   || vizMode === 'all') drawBars();
    if (vizMode === 'wave'   || vizMode === 'all') drawWave();

    for (const p of particles) {
        p.update(energy);
        p.draw();
    }
}
mainLoop();

// ─── UI CONTROLS ───────────────────────────────────────────────────────────
function setMode(m) {
    vizMode = m;
    ['btnCircle','btnBars','btnWave','btnAll'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
    });
    const map = { circle: 'btnCircle', bars: 'btnBars', wave: 'btnWave', all: 'btnAll' };
    if (map[m] && document.getElementById(map[m])) {
        document.getElementById(map[m]).classList.add('active');
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
    } else {
        document.exitFullscreen().catch(()=>{});
    }
}

document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    if (e.key === '1') setMode('circle');
    if (e.key === '2') setMode('bars');
    if (e.key === '3') setMode('wave');
    if (e.key === '4') setMode('all');
});
</script>
